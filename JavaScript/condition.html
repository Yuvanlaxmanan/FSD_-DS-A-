<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a= prompt("Enter a number");
        let n=a;
        let s=0;
        while(n>0){
            let r=n%10;
            s=s+r*r*r;
            n=n/10;
        }
        if(a==s){
            alert(" is armstrong");
        }
        else{
            alert("is not armstrong");
        }
    </script>
</body>
</html>
